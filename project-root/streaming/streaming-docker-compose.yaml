services:
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    networks:
      - iceberg_net
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  schema-registry:
    image: confluentinc/cp-schema-registry:latest
    container_name: schema-registry
    depends_on:
      - kafka
    networks:
      - iceberg_net
    ports:
      - "8082:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 'kafka:9092'

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    networks:
      - iceberg_net
    ports:
      - "9260:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local-cluster
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
      - KAFKA_CLUSTERS_0_SCHEMAREGISTRY=http://schema-registry:8082

  kafka-setup:
      image: apache/kafka:latest
      container_name: kafka-setup
      networks:
        - iceberg_net
      depends_on:
        - kafka
      command: >
        /bin/sh -c "
          echo 'Waiting for Kafka to be ready...'
          # Loop until we can successfully list topics
          while ! /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list; do
            sleep 2
          done
          echo 'Kafka is ready. Creating topics...'
          /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic airbnb_reviews --bootstrap-server kafka:9092 --partitions 1 --replication-factor 1
          echo 'Topic airbnb_reviews created successfully!'
        "
